services:
  movies-db:
    image: postgres:15-alpine
    container_name: movies-db
    environment:
      POSTGRES_DB: movies_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password 
    ports:
      - "5436:5432"
    volumes:
      - postgres_movies_data:/var/lib/postgresql/data
    networks:
      - ticket-net 
  movies-services:
    build: .
    container_name: movies-services
    command: python manage.py runserver 0.0.0.0:8002
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    depends_on:
      - movies-db
    networks:
      - ticket-net
volumes:
  postgres_movies_data:
networks:
  ticket-net:
    external: true
