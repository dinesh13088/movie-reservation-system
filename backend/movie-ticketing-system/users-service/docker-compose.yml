services:
  users-db:
    image: postgres:15-alpine
    container_name: users_db
    environment:
       POSTGRES_DB: users_db
       POSTGRES_USER: db_user
       POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    networks:
      - ticket-net
  users_service:
    build: .
    container_name: users-service
    command: python manage.py runserver 0.0.0.0:8001
    environment:
      DB_NAME: users_db
      DB_USER: db_user
      DB_PASSWORD: password
      DB_HOST: users-db
      DB_PORT: 5432
      KEYCLOAK_SERVER_URL: http://keycloak-mts:8080
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      - users-db
      - keycloak-mts
    networks:
      - ticket-net
volumes:
  postgres_users_data:
  



    

      



